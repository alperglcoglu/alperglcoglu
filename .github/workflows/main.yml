name: Generate Snake

# Her 6 saatte bir ve manuel tetiklemeyle çalışır
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Botun deponuza dosya (görsel) yükleyebilmesi için gereken yazma izni
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Depoyu kontrol eder (Güncel v4 sürümü)
      - uses: actions/checkout@v4

      # Yılan animasyonunu üretir (Güncel v3 sürümü)
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: alperglcoglu
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif

      # Üretilen görselleri "output" dalına (branch) yükler
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
